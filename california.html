      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        h1 { text-align: center; margin: 20px 0; }
        #map { height: 85vh; width: 95%; margin: auto; border: 1px solid #ccc; }
        button { margin-left: 2.5%; margin-bottom: 10px; padding: 8px 15px; cursor: pointer; background-color: #f0f0f0; border: 1px solid #ccc; }
        button:hover { background-color: #e0e0e0; }

    </style>

<body>

<h1>California School Districts Job Search</h1>
<button onclick="window.location.href='index.html'">Back to US Map</button>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

var geocoder = L.Control.geocoder({
    defaultMarkGeocode: false,
    placeholder: "Search Zip or Address...",
    collapsed: false 
})
.on('markgeocode', function(e) {
    var bbox = e.geocode.bbox;
    map.fitBounds(bbox);
})
.addTo(map);

    "Yolo County Office of Education": "https://www.edjoin.org/ycoe",

function normalize(str) {
    if (!str) return "";
    return str.toLowerCase()
              .replace(/unified/g, "")
              .replace(/joint unified/g, "")
              .replace(/elementary/g, "")
              .replace(/union elementary/g, "")
              .replace(/union high/g, "")
              .replace(/city school district/g, "")
              .replace(/school district/g, "")
              .replace(/[^a-z0-9]/g, "")
              .trim();
}

var lookup = {};
for (var originalName in jobLinks) {
    lookup[normalize(originalName)] = jobLinks[originalName];
}

// Fetch California Boundaries (STATEFP='06')
fetch("https://services1.arcgis.com/Ua5sjt3LWTPigjyD/arcgis/rest/services/School_Districts_Current/FeatureServer/0/query?where=STATEFP='06'&outFields=*&f=geojson")
.then(res => res.json())
.then(data => {
    function getStyle(feature) {
        var name = feature.properties.NAME;
        var hasLink = lookup.hasOwnProperty(normalize(name));
        return {
            fillColor: hasLink ? "#2ecc71" : "#e6e6e6",
            color: "#555555",
            weight: 1,
            fillOpacity: 0.6
        };
    }

    var geojsonLayer = L.geoJson(data, {
        style: getStyle,
        onEachFeature: function(feature, layer) {
            var name = feature.properties.NAME;
            var normName = normalize(name);
            var link = lookup[normName];

            layer.bindTooltip("<b>" + name + "</b>" + (link ? "<br><small>Click to view jobs</small>" : ""), { sticky: true });

            layer.on({
                mouseover: function(e) { 
                    e.target.setStyle({ fillColor: "#66ccff", fillOpacity: 0.9 }); 
                },
                mouseout: function(e) { 
                    geojsonLayer.resetStyle(e.target); 
                },
                click: function() {
                    if (link) {
                        var opened = false;

                        // Unified tracking parameter: district_full_name
                        gtag('event', 'click_district', {
                            'district_full_name': name,
                            'state': 'California',
                            'event_callback': function() {
                                if (!opened) {
                                    opened = true;
                                    window.open(link, '_blank');
                                }
                            }
                        });

                        // 800ms fallback in case the gtag callback fails to fire
                        setTimeout(function(){
                            if (!opened) {
                                opened = true;
                                window.open(link, '_blank');
                            }
                        }, 800);
                    }
                }
            });
        }
    }).addTo(map);
});
