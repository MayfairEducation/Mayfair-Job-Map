<!DOCTYPE html>
<html>
<head>
    <title>Nevada School Districts Job Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-41JX7WMDFE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-41JX7WMDFE');
    </script>
    
    <style>
        body { margin: 0; font-family: Arial, sans-serif; overflow-x: hidden; background-color: #f8f9fa; }
        h1 { text-align: center; margin: 15px 0; font-size: 1.5rem; color: #333; }
        #map { height: 75vh; width: 98%; margin: auto; border: 1px solid #ccc; z-index: 1; border-radius: 8px; }
        
        /* Global Button Style */
        .nav-btn { 
            display: inline-block;
            margin-left: 1%; 
            margin-bottom: 10px; 
            padding: 12px 20px; 
            cursor: pointer; 
            background: #ffffff; 
            border: 2px solid #4285F4; 
            color: #4285F4;
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: #4285F4; color: white; }

        /* District Labels */
        .district-label {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            font-weight: bold;
            color: #2c3e50;
            text-shadow: 2px 2px 3px white, -2px -2px 3px white;
            pointer-events: none;
            font-size: 12px;
            display: none; 
        }

        /* FEEDBACK BAR STYLING */
        #feedback-container { 
            position: fixed; 
            bottom: 25px; 
            right: 20px; 
            z-index: 2000; 
            background: white; 
            padding: 10px 20px; 
            border-radius: 50px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); 
            display: flex; 
            align-items: center; 
            border: 2px solid #4285F4; 
        }
        #feedback-input { border: none; outline: none; width: 220px; font-size: 16px; padding: 8px; background: transparent; }
        #feedback-submit { 
            display: none; 
            background: #4285F4; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            padding: 10px 20px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: bold; 
            margin-left: 5px;
        }

        /* MOBILE SPECIFIC OVERRIDES */
        @media (max-width: 768px) {
            h1 { font-size: 1.3rem; margin: 12px 5px; }
            #map { height: 60vh; width: 100%; border-radius: 0; border-left: none; border-right: none; }
            
            .nav-btn { 
                display: block;
                width: 90%; 
                margin: 0 auto 15px auto; 
                text-align: center;
                padding: 15px;
                font-size: 18px;
            }
            
            #feedback-container { 
                width: 85%; 
                left: 5%; 
                right: 5%; 
                bottom: 15px; 
                padding: 12px 15px; 
                border-radius: 12px; 
            }
            #feedback-input { width: 100%; font-size: 16px; } 
            
            .leaflet-control-geocoder { width: 44px !important; height: 44px !important; }
        }
    </style>
</head>
<body>

<h1>Nevada School Districts Job Search</h1>
<button class="nav-btn" onclick="window.location.href='index.html'">Back to US Map</button>

<div id="map"></div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) {showSuccess();}"></iframe>

<div id="feedback-container">
    <form action="https://docs.google.com/forms/d/e/1FAIpQLScjGQuhMgizvq6kSoN1L6By8JB46nvjlf0xearNlpYEnhJYgw/formResponse" 
          method="POST" 
          target="hidden_iframe" 
          id="feedback-form" 
          onsubmit="submitted=true;">
        
        <input type="text" name="entry.1624001477" id="feedback-input" placeholder="Feedback or Questions..." required>
        <input type="hidden" name="entry.SOME_OTHER_ID" value="Nevada"> 

        <button type="submit" id="feedback-submit">Send</button>
    </form>
    <div id="feedback-thanks" style="display: none; color: #4285F4; font-weight: bold; font-size: 14px;">✓ Feedback sent!</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script>
// Mobile Detection
var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
var submitted = false;

// Set initial view: Zoom 5 for mobile to see the whole state, Zoom 6 for desktop
var map = L.map('map').setView([38.5, -117.0], isMobile ? 5 : 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

// Search Bar - Collapsed on Mobile to save space
var geocoder = L.Control.geocoder({
    defaultMarkGeocode: false,
    placeholder: isMobile ? "Search..." : "Search Zip or Address...",
    collapsed: isMobile ? true : false 
})
.on('markgeocode', function(e) {
    map.fitBounds(e.geocode.bbox);
})
.addTo(map);

var jobLinks = {
    "Carson City School District": "https://jobs.redroverk12.com/org/carsoncityschools",
    "Churchill County School District": "https://www.applitrack.com/churchill/onlineapp/default.aspx?all=1",
    "Clark County School District": "https://ccsd.taleo.net/careersection/2/jobsearch.ftl?lang=en",
    "Douglas County School District": "https://www.applitrack.com/dcsd/onlineapp/default.aspx?all=1",
    "Elko County School District": "https://elko.schoolspring.com/",
    "Esmeralda County School District": "https://www.esmeraldacountyschools.com/en-US/employment-opportunities-6a623230",
    "Eureka County School District": "https://www.eureka.k12.nv.us/employment/job_opportunities",
    "Humboldt County School District": "https://hcsdnv.schoolspring.com/",
    "Lander County School District": "https://www.lander.k12.nv.us/careers/available-positions",
    "Lincoln County School District": "https://www.lcsdnv.com/page/Career-Opportunities/15259/Index.html",
    "Lyon County School District": "https://www.applitrack.com/Lyoncsd/onlineapp/default.aspx?all=1",
    "Mineral County School District": "https://www.applitrack.com/nvmcsd/onlineapp/default.aspx?all=1",
    "Nye County School District": "https://www.applitrack.com/nye/onlineapp/default.aspx?all=1",
    "Pershing County School District": "https://www.pcsdnv.com/page/employment",
    "Storey County School District": "https://www.storeynv.com/careers",
    "Washoe County School District": "https://washoe.atenterprise.powerschool.com/ats/job_board?APPLICANT_TYPE_ID=00000001&COMPANY_ID=00004845",
    "White Pine County School District": "https://www.whitepine.k12.nv.us/team"
};

function normalize(str) {
    if (!str) return "";
    return str.toLowerCase().replace(/school district/g, "").replace(/[^a-z0-9]/g, "").trim();
}

var lookup = {};
for (var fullName in jobLinks) {
    lookup[normalize(fullName)] = { displayName: fullName, link: jobLinks[fullName] };
}

fetch("https://services1.arcgis.com/Ua5sjt3LWTPigjyD/arcgis/rest/services/School_Districts_Current/FeatureServer/0/query?where=STATEFP='32'&outFields=NAME,GEOID&f=geojson")
.then(res => res.json())
.then(data => {
    var geojsonLayer = L.geoJson(data, {
        style: function(feature) {
            var hasMatch = lookup.hasOwnProperty(normalize(feature.properties.NAME));
            return {
                fillColor: hasMatch ? "#2ecc71" : "#e6e6e6",
                color: "#555555",
                weight: 1,
                fillOpacity: 0.6
            };
        },
        onEachFeature: function(feature, layer) {
            var rawName = feature.properties.NAME;
            var match = lookup[normalize(rawName)];
            var finalDisplayName = match ? match.displayName : rawName;
            var link = match ? match.link : null;

            // Permanent label (Inside Boundary Logic)
            layer.bindTooltip(finalDisplayName, {
                permanent: true,
                direction: 'center',
                className: 'district-label',
                offset: [0, 0]
            });

            layer.on({
                mouseover: function(e) { 
                    if (!isMobile) e.target.setStyle({ fillColor: "#66ccff", fillOpacity: 0.9 }); 
                },
                mouseout: function(e) { 
                    if (!isMobile) geojsonLayer.resetStyle(e.target); 
                },
                click: function() {
                    if (link) {
                        gtag('event', 'click_district', { 'district_name': finalDisplayName, 'state': 'Nevada' });
                        window.open(link, '_blank');
                    }
                }
            });
        }
    }).addTo(map);

    // Zoom-based Label visibility
    map.on('zoomend', function() {
        var zoom = map.getZoom();
        var threshold = isMobile ? 8 : 7; // Mobile needs more zoom to see labels
        var labels = document.querySelectorAll('.district-label');
        labels.forEach(function(l) {
            l.style.display = (zoom >= threshold) ? 'block' : 'none';
        });
    });
});

// Feedback Logic
const fInput = document.getElementById('feedback-input');
const fSubmit = document.getElementById('feedback-submit');
const fForm = document.getElementById('feedback-form');
const fThanks = document.getElementById('feedback-thanks');

fInput.addEventListener('focus', () => { fSubmit.style.display = 'block'; });

function showSuccess() {
    if(submitted) {
        fForm.style.display = 'none';
        fThanks.style.display = 'block';
        setTimeout(() => {
            fThanks.style.display = 'none';
            fForm.style.display = 'flex';
            fForm.reset();
            fSubmit.style.display = 'none';
            submitted = false;
        }, 4000);
    }
}
</script>
</body>
</html>
