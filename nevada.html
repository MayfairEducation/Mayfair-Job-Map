<!DOCTYPE html>
<html>
<head>
    <title>Nevada Job Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #f8f9fa; }
        h1 { text-align: center; margin: 15px 0; font-size: 1.5rem; color: #333; }
        #map { height: 75vh; width: 98%; margin: auto; border: 1px solid #ccc; border-radius: 8px; background: #fff; z-index: 1; }
        
        .nav-btn { 
            display: inline-block; margin-left: 1%; margin-bottom: 10px; padding: 12px 20px; 
            background: #ffffff; border: 2px solid #4285F4; color: #4285F4;
            border-radius: 8px; font-size: 16px; font-weight: bold; text-decoration: none;
        }

        .district-label {
            background: transparent !important; border: none !important; box-shadow: none !important;
            font-weight: bold; color: #2c3e50; text-shadow: 1px 1px 2px white;
            pointer-events: none; font-size: 10px; text-transform: uppercase; display: none !important; 
        }

        .show-label { display: block !important; }

        /* FEEDBACK & CONNECT BAR */
        #feedback-container { 
            position: fixed; bottom: 25px; right: 20px; z-index: 2000; 
            background: white; padding: 12px 20px; border-radius: 30px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.2); border: 2px solid #4285F4;
            transition: all 0.3s ease; max-width: 90%;
        }
        
        .form-row { display: flex; align-items: center; gap: 10px; }
        .connect-fields { display: none; flex-direction: column; gap: 8px; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
        
        input { border: none; outline: none; font-size: 16px; background: transparent; width: 100%; }
        .connect-btn { color: #4285F4; cursor: pointer; font-size: 12px; font-weight: bold; text-decoration: underline; white-space: nowrap; }
        
        #feedback-submit { 
            background: #4285F4; color: white; border: none; 
            border-radius: 20px; padding: 8px 15px; cursor: pointer; font-weight: bold; 
            margin-top: 5px; width: 100%; display: none;
        }

        @media (max-width: 768px) {
            #map { height: 60vh; width: 100%; border-radius: 0; }
            .nav-btn { display: block; width: 90%; margin: 0 auto 15px auto; text-align: center; }
            #feedback-container { left: 5%; right: 5%; bottom: 15px; border-radius: 15px; width: auto; }
        }
    </style>
</head>
<body>

<h1>Nevada School Districts</h1>
<a href="index.html" class="nav-btn">Back to US Map</a>

<div id="map"></div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) {showSuccess();}"></iframe>

<div id="feedback-container">
    <form action="https://docs.google.com/forms/d/e/1FAIpQLScjGQuhMgizvq6kSoN1L6By8JB46nvjlf0xearNlpYEnhJYgw/formResponse" method="POST" target="hidden_iframe" id="feedback-form" onsubmit="submitted=true;">
        
        <div class="form-row">
            <input type="text" name="entry.1624001477" id="feedback-input" placeholder="Anonymous Feedback..." required>
            <span class="connect-btn" id="toggle-connect">Connect with us?</span>
        </div>

        <div class="connect-fields" id="connect-fields">
            <input type="email" name="entry.EMAIL_ID" placeholder="Email Address (Optional)">
            <input type="tel" name="entry.PHONE_ID" placeholder="Phone Number (Optional)">
            <small style="color: #666; font-size: 10px;">Sharing info allows us to respond to your inquiry.</small>
        </div>

        <button type="submit" id="feedback-submit">Submit Feedback</button>
    </form>
    <div id="feedback-thanks" style="display: none; color: #4285F4; font-weight: bold; text-align: center;">✓ Sent! Thank you.</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script>
var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
var submitted = false;
var map = L.map('map').setView([38.5, -117.0], isMobile ? 5 : 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

var geocoder = L.Control.geocoder({
    defaultMarkGeocode: false,
    placeholder: "Search...",
    collapsed: isMobile
}).on('markgeocode', function(e) { map.fitBounds(e.geocode.bbox); }).addTo(map);

function cleanName(name) {
    return name.replace(/School District/gi, "").replace(/Public Schools/gi, "").replace(/Community Unit/gi, "").trim();
}

// [JobLinks and Normalize logic remain exactly the same as previous...]
var jobLinks = {
    "Carson City School District": "https://jobs.redroverk12.com/org/carsoncityschools",
    "Churchill County School District": "https://www.applitrack.com/churchill/onlineapp/default.aspx?all=1",
    "Clark County School District": "https://ccsd.taleo.net/careersection/2/jobsearch.ftl?lang=en",
    "Douglas County School District": "https://www.applitrack.com/dcsd/onlineapp/default.aspx?all=1",
    "Elko County School District": "https://elko.schoolspring.com/",
    "Esmeralda County School District": "https://www.esmeraldacountyschools.com/en-US/employment-opportunities-6a623230",
    "Eureka County School District": "https://www.eureka.k12.nv.us/employment/job_opportunities",
    "Humboldt County School District": "https://hcsdnv.schoolspring.com/",
    "Lander County School District": "https://www.lander.k12.nv.us/careers/available-positions",
    "Lincoln County School District": "https://www.lcsdnv.com/page/Career-Opportunities/15259/Index.html",
    "Lyon County School District": "https://www.applitrack.com/Lyoncsd/onlineapp/default.aspx?all=1",
    "Mineral County School District": "https://www.applitrack.com/nvmcsd/onlineapp/default.aspx?all=1",
    "Nye County School District": "https://www.applitrack.com/nye/onlineapp/default.aspx?all=1",
    "Pershing County School District": "https://www.pcsdnv.com/page/employment",
    "Storey County School District": "https://www.storeynv.com/careers",
    "Washoe County School District": "https://washoe.atenterprise.powerschool.com/ats/job_board?APPLICANT_TYPE_ID=00000001&COMPANY_ID=00004845",
    "White Pine County School District": "https://www.whitepine.k12.nv.us/team"
};

function normalize(str) {
    if (!str) return "";
    return str.toLowerCase().replace(/school district/g, "").replace(/[^a-z0-9]/g, "").trim();
}

var lookup = {};
for (var fullName in jobLinks) {
    lookup[normalize(fullName)] = { displayName: cleanName(fullName), link: jobLinks[fullName] };
}

fetch("https://services1.arcgis.com/Ua5sjt3LWTPigjyD/arcgis/rest/services/School_Districts_Current/FeatureServer/0/query?where=STATEFP='32'&outFields=NAME&f=geojson")
.then(res => res.json())
.then(data => {
    var geojsonLayer = L.geoJson(data, {
        style: function(feature) {
            var hasMatch = lookup.hasOwnProperty(normalize(feature.properties.NAME));
            return { fillColor: hasMatch ? "#2ecc71" : "#e6e6e6", color: "#555", weight: 1, fillOpacity: 0.6 };
        },
        onEachFeature: function(feature, layer) {
            var rawName = feature.properties.NAME;
            var match = lookup[normalize(rawName)];
            var display = match ? match.displayName : cleanName(rawName);
            var link = match ? match.link : null;

            if (isMobile) {
                layer.bindTooltip(display, { permanent: true, direction: 'center', className: 'district-label' });
            } else {
                layer.bindTooltip("<b>" + display + "</b>" + (link ? "<br>Click to view jobs" : ""), { sticky: true });
            }

            layer.on({
                mouseover: function(e) { if(!isMobile) e.target.setStyle({ fillOpacity: 0.9, fillColor: '#66ccff' }); },
                mouseout: function(e) { if(!isMobile) geojsonLayer.resetStyle(e.target); },
                click: function() { if (link) window.open(link, '_blank'); }
            });
        }
    }).addTo(map);

    function updateLabelVisibility() {
        var zoom = map.getZoom();
        var labels = document.querySelectorAll('.district-label');
        labels.forEach(l => {
            if (zoom >= 8) { l.classList.add('show-label'); } 
            else { l.classList.remove('show-label'); }
        });
    }
    map.on('zoomend', updateLabelVisibility);
});

// NEW FEEDBACK & CONNECT LOGIC
const fInput = document.getElementById('feedback-input');
const fSubmit = document.getElementById('feedback-submit');
const toggleBtn = document.getElementById('toggle-connect');
const connectFields = document.getElementById('connect-fields');

// Show Submit button when they start typing
fInput.addEventListener('input', () => { 
    if(fInput.value.length > 0) fSubmit.style.display = 'block'; 
});

// Toggle the Email/Phone fields
toggleBtn.addEventListener('click', () => {
    const isHidden = connectFields.style.display === '' || connectFields.style.display === 'none';
    connectFields.style.display = isHidden ? 'flex' : 'none';
    toggleBtn.innerText = isHidden ? 'Hide info' : 'Connect with us?';
    fSubmit.style.display = 'block'; // Always show submit if they open connect
});

function showSuccess() {
    if(submitted) {
        document.getElementById('feedback-form').style.display = 'none'; 
        document.getElementById('feedback-thanks').style.display = 'block';
        setTimeout(() => { location.reload(); }, 3000); // Reload to reset the state
    }
}
</script>
</body>
</html>
