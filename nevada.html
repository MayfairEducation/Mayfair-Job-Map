<!DOCTYPE html>
<html>
<head>
    <title>Nevada School Districts Job Map</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-41JX7WMDFE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-41JX7WMDFE');
    </script>
    
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        h1 { text-align: center; margin: 20px 0; }
        #map { height: 85vh; width: 95%; margin: auto; border: 1px solid #ccc; }
        .nav-btn { margin-left: 2.5%; margin-bottom: 10px; padding: 8px 15px; cursor: pointer; background: white; border: 1px solid #ccc; border-radius: 4px; }
        .nav-btn:hover { background: #f0f0f0; }
        
        /* Feedback Bar CSS */
        #feedback-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; background: white; padding: 8px 15px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); display: flex; align-items: center; border: 1px solid #eee; }
        #feedback-input { border: none; outline: none; width: 220px; font-size: 14px; padding: 5px; background: transparent; }
        #feedback-submit { display: none; background: #4285F4; color: white; border: none; border-radius: 20px; padding: 5px 15px; cursor: pointer; font-size: 12px; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>

<h1>Nevada School Districts Job Search</h1>
<button class="nav-btn" onclick="window.location.href='index.html'">Back to US Map</button>
<div id="map"></div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) {showSuccess();}"></iframe>

<div id="feedback-container">
    <form action="https://docs.google.com/forms/d/e/1FAIpQLScjGQuhMgizvq6kSoN1L6By8JB46nvjlf0xearNlpYEnhJYgw/formResponse" 
          method="POST" 
          target="hidden_iframe" 
          id="feedback-form" 
          onsubmit="submitted=true;">
        
        <input type="text" name="entry.1624001477" id="feedback-input" placeholder="Submit questions and feedback..." required>
        
        <input type="hidden" name="entry.SOME_OTHER_ID" value="Nevada"> 

        <button type="submit" id="feedback-submit">Send</button>
    </form>
    <div id="feedback-thanks" style="display: none; color: #4285F4; font-weight: bold; font-size: 14px;">✓ Feedback sent!</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script>
// Nevada View
var map = L.map('map').setView([38.5, -117.0], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

// Search
var geocoder = L.Control.geocoder({
    defaultMarkGeocode: false,
    placeholder: "Search Zip or Address...",
    collapsed: false 
})
.on('markgeocode', function(e) {
    map.fitBounds(e.geocode.bbox);
})
.addTo(map);

// District Links
var jobLinks = {
    "Carson City School District": "https://jobs.redroverk12.com/org/carsoncityschools",
    "Churchill County School District": "https://www.applitrack.com/churchill/onlineapp/default.aspx?all=1",
    "Clark County School District": "https://ccsd.taleo.net/careersection/2/jobsearch.ftl?lang=en",
    "Douglas County School District": "https://www.applitrack.com/dcsd/onlineapp/default.aspx?all=1",
    "Elko County School District": "https://elko.schoolspring.com/",
    "Esmeralda County School District": "https://www.esmeraldacountyschools.com/en-US/employment-opportunities-6a623230",
    "Eureka County School District": "https://www.eureka.k12.nv.us/employment/job_opportunities",
    "Humboldt County School District": "https://hcsdnv.schoolspring.com/",
    "Lander County School District": "https://www.lander.k12.nv.us/careers/available-positions",
    "Lincoln County School District": "https://www.lcsdnv.com/page/Career-Opportunities/15259/Index.html",
    "Lyon County School District": "https://www.applitrack.com/Lyoncsd/onlineapp/default.aspx?all=1",
    "Mineral County School District": "https://www.applitrack.com/nvmcsd/onlineapp/default.aspx?all=1",
    "Nye County School District": "https://www.applitrack.com/nye/onlineapp/default.aspx?all=1",
    "Pershing County School District": "https://www.pcsdnv.com/page/employment",
    "Storey County School District": "https://www.storeynv.com/careers",
    "Washoe County School District": "https://washoe.atenterprise.powerschool.com/ats/job_board?APPLICANT_TYPE_ID=00000001&COMPANY_ID=00004845",
    "White Pine County School District": "https://www.whitepine.k12.nv.us/team"
};

function normalize(str) {
    if (!str) return "";
    return str.toLowerCase().replace(/school district/g, "").replace(/[^a-z0-9]/g, "").trim();
}

var lookup = {};
for (var fullName in jobLinks) {
    lookup[normalize(fullName)] = { displayName: fullName, link: jobLinks[fullName] };
}

// Fetch State Data
fetch("https://services1.arcgis.com/Ua5sjt3LWTPigjyD/arcgis/rest/services/School_Districts_Current/FeatureServer/0/query?where=STATEFP='32'&outFields=NAME,GEOID&f=geojson")
.then(res => res.json())
.then(data => {
    var geojsonLayer = L.geoJson(data, {
        style: function(feature) {
            var hasMatch = lookup.hasOwnProperty(normalize(feature.properties.NAME));
            return {
                fillColor: hasMatch ? "#2ecc71" : "#e6e6e6",
                color: "#555555",
                weight: 1,
                fillOpacity: 0.6
            };
        },
        onEachFeature: function(feature, layer) {
            var rawName = feature.properties.NAME;
            var match = lookup[normalize(rawName)];
            var finalDisplayName = match ? match.displayName : rawName;
            var link = match ? match.link : null;

            layer.bindTooltip("<b>" + finalDisplayName + "</b>" + (link ? "<br><small>Click to view jobs</small>" : ""), { sticky: true });

            layer.on({
                mouseover: function(e) { e.target.setStyle({ fillColor: "#66ccff", fillOpacity: 0.9 }); },
                mouseout: function(e) { geojsonLayer.resetStyle(e.target); },
                click: function() {
                    if (link) {
                        gtag('event', 'click_district', { 'district_name': finalDisplayName, 'state': 'Nevada' });
                        window.open(link, '_blank');
                    }
                }
            });
        }
    }).addTo(map);
});

// Feedback Logic
var submitted = false;
const fInput = document.getElementById('feedback-input');
const fSubmit = document.getElementById('feedback-submit');
const fForm = document.getElementById('feedback-form');
const fThanks = document.getElementById('feedback-thanks');

fInput.addEventListener('focus', () => { fSubmit.style.display = 'block'; });

function showSuccess() {
    if(submitted) {
        fForm.style.display = 'none';
        fThanks.style.display = 'block';
        setTimeout(() => {
            fThanks.style.display = 'none';
            fForm.style.display = 'flex';
            fForm.reset();
            fSubmit.style.display = 'none';
            submitted = false;
        }, 4000);
    }
}
</script>
</body>
</html>
