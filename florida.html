<!DOCTYPE html>
<html>
<head>
  <title>Florida School Districts Job Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-41JX7WMDFE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-41JX7WMDFE");
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
    }

    h1 {
      text-align: center;
      margin: 15px 0;
      font-size: 1.5rem;
      color: #333;
    }

    #map {
      height: 75vh;
      width: 98%;
      margin: auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      z-index: 1;
    }

    .nav-btn {
      display: inline-block;
      margin-left: 1%;
      margin-bottom: 10px;
      padding: 12px 20px;
      background: #ffffff;
      border: 2px solid #4285F4;
      color: #4285F4;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
    }

    .district-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      font-weight: bold;
      color: #2c3e50;
      text-shadow: 1px 1px 2px white;
      pointer-events: none;
      font-size: 10px;
      text-transform: uppercase;
      display: none !important;
      white-space: nowrap;
    }

    .show-label {
      display: block !important;
    }

    #feedback-container {
      position: fixed;
      bottom: 25px;
      right: 20px;
      z-index: 2000;
      background: white;
      padding: 10px 15px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      border: 2px solid #4285F4;
      width: 320px;
      max-width: 85%;
      transition: all 0.3s ease-in-out;
    }

    #feedback-container.expanded {
      border-radius: 15px;
      padding: 15px;
    }

    #feedback-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .extra-fields {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 5px;
    }

    #feedback-container.expanded .extra-fields {
      display: flex;
    }

    input {
      border: 1px solid transparent;
      outline: none;
      font-size: 15px;
      background: transparent;
      width: 100%;
      padding: 5px;
      box-sizing: border-box;
    }

    #feedback-container.expanded input {
      border: 1px solid #eee;
      background: #fafafa;
      border-radius: 5px;
      padding: 8px;
    }

    .response-note {
      font-size: 10px;
      color: #666;
      font-style: italic;
      display: none;
    }

    #feedback-container.expanded .response-note {
      display: block;
    }

    #feedback-submit {
      background: #4285F4;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px;
      cursor: pointer;
      font-weight: bold;
      display: none;
      margin-top: 5px;
    }

    #feedback-container.expanded #feedback-submit {
      display: block;
    }

    @media (max-width: 768px) {
      #map {
        height: 60vh;
        width: 100%;
        border-radius: 0;
      }

      .nav-btn {
        display: block;
        width: 90%;
        margin: 0 auto 15px auto;
        text-align: center;
        box-sizing: border-box;
      }

      #feedback-container {
        left: 5%;
        right: 5%;
        bottom: 15px;
        width: auto;
      }
    }
  </style>
</head>

<body>
  <h1 id="page-title">Florida School Districts</h1>
  <a href="index.html" class="nav-btn">Back to US Map</a>

  <div id="map"></div>

  <iframe
    name="hidden_iframe"
    id="hidden_iframe"
    style="display:none;"
    onload="if(submitted) { showSuccess(); }">
  </iframe>

  <div id="feedback-container">
    <form
      action="https://docs.google.com/forms/d/e/1FAIpQLScjGQuhMgizvq6kSoN1L6By8JB46nvjlf0xearNlpYEnhJYgw/formResponse"
      method="POST"
      target="hidden_iframe"
      id="feedback-form"
      onsubmit="submitted = true;">

      <input
        type="text"
        name="entry.1624001477"
        id="main-input"
        placeholder="Questions, feedback, or broken links?"
        required>

      <div class="extra-fields" id="extra-fields">
        <input type="text" name="entry.973226408" id="name-input" placeholder="Your Name (Optional)">
        <input type="email" name="entry.1613736585" id="email-input" placeholder="Email (Required for a response)">
        <input type="tel" name="entry.546569702" id="phone-input" placeholder="Phone Number (Optional)">
        <input type="hidden" name="entry.607554921" id="feedback-context" value="Florida Map Inquiry">

        <div class="response-note">Providing contact info helps us respond to your inquiry.</div>
        <button type="submit" id="feedback-submit">Send Inquiry</button>
      </div>
    </form>

    <div id="feedback-thanks" style="display:none; color:#4285F4; font-weight:bold; text-align:center; padding:5px;">
      Thank you! We'll be in touch.
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <script>
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    var submitted = false;

    var defaultStateSettings = {
      desktopZoom: 7,
      mobileZoom: 6,
      labelZoom: 8,
      districtWeight: 1,
      fillOpacity: 0.6,
      hoverFillOpacity: 0.9,
      matchedFillColor: "#2ecc71",
      unmatchedFillColor: "#e6e6e6",
      hoverFillColor: "#66ccff",
      borderColor: "#555"
    };

    var stateConfig = {
      name: "Florida",
      stateFp: "12",
      center: [27.8, -83.5],
      feedbackContext: "Florida Map Inquiry",

      aliases: {
        dade: "miamidade"
      },

      jobLinks: {
        "Alachua": "https://skyward.iscorp.com/scripts/wsisa.dll/WService=wsfinalachuafl/Rapplmnu03.w",
        "Baker": "https://bakerskyward.nefec.org:444/scripts/wsisa.dll/WService=wsFin/rapplmnu03.w",
        "Bay": "https://focus.bayschools.net/focus/jobs/#!Jobs",
        "Bradford": "https://bradfordskyward.nefec.org:444/scripts/wsisa.dll/WService=wsFin/rapplmnu03.w",
        "Brevard": "https://iss.brevard.k12.fl.us/JOBLST.pgm",
        "Broward": "https://careers.browardschools.com/search/?q=&",
        "Calhoun": "https://ats3.atenterprise.powerschool.com/ats/app_login?COMPANY_ID=00012151",
        "Charlotte": "https://charlotteschools.schoolspring.com/",
        "Citrus": "https://skyfin.citrusschools.org:444/scripts/wsisa.dll/WService=wsFin/rappljoblst484.w",
        "Clay": "https://oneclay.schoolspring.com/",
        "Collier": "https://a1-3.applitrack.com/collier/onlineapp/default.aspx?all=1",
        "Columbia": "https://columbiaskyward.nefec.org:444/scripts/wsisa.dll/WService=wsFin/rapplmnu03.w",
        "DeSoto": "https://www.applitrack.com/desotoschools/onlineapp/default.aspx?all=1",
        "Dixie": "https://dixieskyward.nefec.org:444/scripts/wsisa.dll/WService=wsFin/rapplmnu03.w",
        "Duval": "https://duvalschools.schoolspring.com/",
        "Escambia": "https://apps2.winocular.com/Escambia/workspace/wSpace.exe?Action=wsJobsMain",
        "Flagler": "https://flaglerschools.schoolspring.com/",
        "Franklin": "https://skyward.iscorp.com/scripts/wsisa.dll/WService=wsfinfranklincoflpaec/rapplmnu03.w",
        "Gadsden": "https://gadsdenschools.atenterprise.powerschool.com/ats/app_login?COMPANY_ID=00005588",
        "Gilchrist": "https://gilchristskyward.nefec.org:444/scripts/wsisa.dll/WService=wsFin/rapplmnu03.w",
        "Glades": "https://skyward.glades-schools.org/scripts/wsisa.dll/WService=wsFin/rapplmnu03.w",
        "Gulf": "https://gulfcoschools.com/district/employment/",
        "Hamilton": "https://hamiltonskyward.nefec.org:444/scripts/wsisa.dll/WService=wsFin/rapplmnu03.w",
        "Hardee": "https://www.hardee.k12.fl.us/page/recruitment",
        "Hendry": "https://www.applitrack.com/hendry/onlineapp/default.aspx?all=1",
        "Hernando": "https://www.hernandoschools.org/jobs-home",
        "Highlands": "https://www.applitrack.com/highlandscounty/onlineapp/default.aspx?all=1",
        "Hillsborough": "https://css-sdhc-prd.inforcloudsuite.com/hcm/Jobs/form/JobBoard%28HCPS,HCPS%20JOB%20BOARD%29.JobSearchCompositeForm?navigation=JobBoard%28HCPS,HCPS%20JOB%20BOARD%29.JobSearchCompositeFormNav&csk.JobBoard=HCPS%20JOB%20BOARD&csk.HROrganization=HCPS",
        "Holmes": "https://www.hdsb.org/employment",
        "Indian River": "https://www.applitrack.com/indianriver/onlineapp/default.aspx?all=1",
        "Jackson": "https://www.applitrack.com/paec/onlineapp/jobpostings/view.asp?dist=2044&district=All&category=All",
        "Jefferson": "https://www.jeffersonschools.net/careers",
        "Lafayette": "https://lafayetteskyward.nefec.org:444/scripts/wsisa.dll/WService=wsFin/rappljoblst484.w",
        "Lake": "https://lakecsd.schoolspring.com/",
        "Lee": "https://apply.leeschools.net/",
        "Leon": "https://ats3.atenterprise.powerschool.com/ats/app_login?COMPANY_ID=JA001601",
        "Levy": "https://levyskyward.nefec.org/scripts/wsisa.dll/WService=wsFin/rappljoblst484.w",
        "Liberty": "https://ats3.atenterprise.powerschool.com/ats/app_login?COMPANY_ID=00012159",
        "Madison": "https://skyward.mcsbfl.us:444/scripts/wsisa.dll/WService=wsFin/rappljoblst463.w",
        "Manatee": "https://careers.manateeschools.net/psc/HCPRDC/EMPLOYEE/HRMS/c/HRS_HRAM_FL.HRS_CG_SEARCH_FL.GBL?Page=HRS_CAREERS_FL&Action=U&FOCUS=Applicant&SiteId=1&",
        "Marion": "https://www.marionschools.net/departments/careers_at_mcps/current_openings",
        "Martin": "https://skyward.iscorp.com/scripts/wsisa.dll/WService=wsfinmartincofl/rapplmnu03.w",
        "Miami-Dade": "https://apply.dadeschools.net/search/",
        "Monroe": "https://www.applitrack.com/keysschools/onlineapp/default.aspx?all=1",
        "Nassau": "https://www.applitrack.com/nassau/onlineapp/default.aspx?all=1",
        "Okaloosa": "https://okaloosa.focusschoolsoftware.com/focus/jobs/#!Jobs",
        "Okeechobee": "https://skyward.iscorp.com/scripts/wsisa.dll/WService=wsfinokeechobeedrfl/rapplmnu03.w",
        "Orange": "https://www.ocps.net/careers-home",
        "Osceola": "https://jobs.osceolaschools.net/jobs",
        "Palm Beach": "https://erp.palmbeach.k12.fl.us:8009/psc/HRPRDJ/EMPLOYEE/HRMS/c/HRS_HRAM_FL.HRS_CG_SEARCH_FL.GBL?FOCUS=Applicant&SiteId=1&&Page=HRS_CAREERS_FL",
        "Pasco": "https://pasco.schoolspring.com/",
        "Pinellas": "https://ats3.atenterprise.powerschool.com/ats/app_login?COMPANY_ID=OA002067",
        "Polk": "https://www.polkschoolsfl.com/careers/jobopenings",
        "Putnam": "https://putnamskyward.nefec.org/scripts/wsisa.dll/WService=wsFin/rapplmnu03.w",
        "Santa Rosa": "https://santarosa.schoolspring.com/",
        "Sarasota": "https://www.sarasota.k12.fl.us/jobs/",
        "Seminole": "https://careers.scps.k12.fl.us/psc/HCPRD/EMPLOYEE/HRMS/c/HRS_HRAM_FL.HRS_CG_SEARCH_FL.GBL?Action=U&FOCUS=Applicant&SiteId=1&&Page=HRS_CAREERS_FL",
        "St Johns": "https://www.applitrack.com/stjohns/onlineapp/default.aspx?all=1",
        "St Lucie": "https://business.stlucie.k12.fl.us/scripts/wsisa.dll/WService=wsFin/rapplmnu03.w",
        "Sumter": "https://www.sumter.k12.fl.us/non-instructional-job-descriptions",
        "Suwannee": "https://www.applitrack.com/suwannee/onlineapp/default.aspx?all=1",
        "Taylor": "https://www.taylor.k12.fl.us/jobopenings",
        "Union": "https://unionskyward.nefec.org:444/scripts/wsisa.dll/WService=wsFin/rapplmnu03.w",
        "Volusia": "https://volusia.focusschoolsoftware.com/focus/jobs/#!Jobs",
        "Wakulla": "https://wcsb.schoolspring.com/",
        "Walton": "https://ats3.atenterprise.powerschool.com/ats/app_login?COMPANY_ID=WA002771",
        "Washington": "https://skyward.iscorp.com/scripts/wsisa.dll/WService=wsfinwashingtoncoflpaec/rappljoblst484.w?hqrbgrtid=84565"
      }
    };

    var settings = Object.assign({}, defaultStateSettings, stateConfig);

    document.getElementById("page-title").textContent = settings.name + " School Districts";
    document.getElementById("feedback-context").value = settings.feedbackContext;

    var map = L.map("map").setView(
      settings.center,
      isMobile ? settings.mobileZoom : settings.desktopZoom
    );

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    L.Control.geocoder({
      defaultMarkGeocode: false,
      placeholder: "Search...",
      collapsed: isMobile
    }).on("markgeocode", function(e) {
      map.fitBounds(e.geocode.bbox);
    }).addTo(map);

    function cleanName(name) {
      return name
        .replace(/School District/gi, "")
        .replace(/District Schools/gi, "")
        .replace(/Public Schools/gi, "")
        .replace(/County/gi, "")
        .trim();
    }

    function normalize(str) {
      if (!str) return "";

      var normalized = str
        .toLowerCase()
        .replace(/school district/g, "")
        .replace(/district schools/g, "")
        .replace(/public schools/g, "")
        .replace(/county/g, "")
        .replace(/[^a-z0-9]/g, "")
        .trim();

      return settings.aliases[normalized] || normalized;
    }

    var lookup = {};

    for (var fullName in settings.jobLinks) {
      lookup[normalize(fullName)] = {
        displayName: cleanName(fullName),
        link: settings.jobLinks[fullName]
      };
    }

    var boundaryUrl =
      "https://services1.arcgis.com/Ua5sjt3LWTPigjyD/arcgis/rest/services/School_Districts_Current/FeatureServer/0/query" +
      "?where=STATEFP='" + settings.stateFp + "'" +
      "&outFields=NAME" +
      "&f=geojson";

    fetch(boundaryUrl)
      .then(function(res) {
        return res.json();
      })
      .then(function(data) {
        var geojsonLayer = L.geoJson(data, {
          style: function(feature) {
            var hasMatch = lookup.hasOwnProperty(normalize(feature.properties.NAME));

            return {
              fillColor: hasMatch ? settings.matchedFillColor : settings.unmatchedFillColor,
              color: settings.borderColor,
              weight: settings.districtWeight,
              fillOpacity: settings.fillOpacity
            };
          },

          onEachFeature: function(feature, layer) {
            var rawName = feature.properties.NAME;
            var match = lookup[normalize(rawName)];
            var display = match ? match.displayName : cleanName(rawName);
            var link = match ? match.link : null;

            layer.bindTooltip(display, {
              permanent: true,
              direction: "center",
              className: "district-label",
              offset: [0, 0]
            });

            layer.on({
              mouseover: function(e) {
                if (!isMobile) {
                  e.target.setStyle({
                    fillOpacity: settings.hoverFillOpacity,
                    fillColor: settings.hoverFillColor
                  });
                }
              },

              mouseout: function(e) {
                if (!isMobile) {
                  geojsonLayer.resetStyle(e.target);
                }
              },

              click: function() {
                if (link) {
                  gtag("event", "click_district", {
                    district_name: display,
                    state: settings.name
                  });

                  window.open(link, "_blank");
                }
              }
            });
          }
        }).addTo(map);

        function updateLabelVisibility() {
          var zoom = map.getZoom();
          var labels = document.querySelectorAll(".district-label");

          labels.forEach(function(label) {
            if (zoom >= settings.labelZoom) {
              label.classList.add("show-label");
            } else {
              label.classList.remove("show-label");
            }
          });
        }

        map.on("zoomend", updateLabelVisibility);
        updateLabelVisibility();
      });

    var container = document.getElementById("feedback-container");
    var mainInput = document.getElementById("main-input");
    var nameInput = document.getElementById("name-input");
    var emailInput = document.getElementById("email-input");

    mainInput.addEventListener("focus", function() {
      container.classList.add("expanded");
    });

    map.on("mousedown", function() {
      if (mainInput.value === "" && nameInput.value === "" && emailInput.value === "") {
        container.classList.remove("expanded");
        mainInput.blur();
      }
    });

    function showSuccess() {
      if (submitted) {
        document.getElementById("feedback-form").style.display = "none";
        document.getElementById("feedback-thanks").style.display = "block";

        setTimeout(function() {
          location.reload();
        }, 3000);
      }
    }
  </script>
</body>
</html>
